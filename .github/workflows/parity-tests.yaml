name: R-Python parity

on:
  push:
    branches: [main]
    paths:
      - "R/**"
      - "python/**"
      - "inst/extdata/**"
      - "benchmark/parity/**"
      - ".github/workflows/parity-tests.yaml"
  pull_request:
    branches: [main]
    paths:
      - "R/**"
      - "python/**"
      - "inst/extdata/**"
      - "benchmark/parity/**"
      - ".github/workflows/parity-tests.yaml"

permissions: read-all

concurrency:
  group: parity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::roxygen2
          needs: check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R package
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          R CMD INSTALL .

      - name: Install Python package
        run: python -m pip install -e python

      - name: Run R evaluation
        run: Rscript benchmark/parity/run_r_parity.R /tmp/r_parity.csv

      - name: Run Python evaluation
        run: python benchmark/parity/run_python_parity.py /tmp/python_parity.csv

      - name: Compare outputs
        run: python benchmark/parity/compare_parity.py /tmp/r_parity.csv /tmp/python_parity.csv
