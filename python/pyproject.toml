[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrinfer"
version = "0.0.1"
description = "Statistical evaluation of OCR and HTR outputs, with policy-sensitive and paired analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Florian Cafiero"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "regex>=2023.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
